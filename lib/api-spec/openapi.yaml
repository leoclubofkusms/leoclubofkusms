openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Client portal API for a freelance design business
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: projects
    description: Project management
  - name: files
    description: File uploads and management
  - name: messages
    description: Project messages and comments

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, in_progress, review, completed]
          required: false
        - in: query
          name: search
          schema:
            type: string
          required: false
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Submit a new project request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectBody"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/stats:
    get:
      operationId: getProjectStats
      tags: [projects]
      summary: Get dashboard stats
      description: Returns counts and summaries for the dashboard
      responses:
        "200":
          description: Project statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectStats"

  /projects/activity:
    get:
      operationId: getRecentActivity
      tags: [projects]
      summary: Get recent activity feed
      responses:
        "200":
          description: Recent activity items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a single project
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project (status, notes, etc.)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectBody"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required:
                  - success

  /projects/{id}/files:
    get:
      operationId: listProjectFiles
      tags: [files]
      summary: List files for a project
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectFile"
    post:
      operationId: uploadProjectFile
      tags: [files]
      summary: Upload a file to a project
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        "201":
          description: File uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectFile"

  /projects/{id}/files/{fileId}:
    delete:
      operationId: deleteProjectFile
      tags: [files]
      summary: Delete a file from a project
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: fileId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required:
                  - success

  /projects/{id}/messages:
    get:
      operationId: listProjectMessages
      tags: [messages]
      summary: List messages for a project
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Messages list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: createProjectMessage
      tags: [messages]
      summary: Post a message on a project
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageBody"
      responses:
        "201":
          description: Message created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Project:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        clientName:
          type: string
        clientEmail:
          type: string
        projectType:
          type: string
          enum: [logo, branding, web_design, print, illustration, other]
        status:
          type: string
          enum: [pending, in_progress, review, completed]
        priority:
          type: string
          enum: [low, medium, high]
        budget:
          type: number
          nullable: true
        deadline:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        fileCount:
          type: integer
        messageCount:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - title
        - description
        - clientName
        - clientEmail
        - projectType
        - status
        - priority
        - fileCount
        - messageCount
        - createdAt
        - updatedAt

    CreateProjectBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        clientName:
          type: string
        clientEmail:
          type: string
        projectType:
          type: string
          enum: [logo, branding, web_design, print, illustration, other]
        priority:
          type: string
          enum: [low, medium, high]
        budget:
          type: number
          nullable: true
        deadline:
          type: string
          nullable: true
      required:
        - title
        - description
        - clientName
        - clientEmail
        - projectType
        - priority

    UpdateProjectBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [pending, in_progress, review, completed]
        priority:
          type: string
          enum: [low, medium, high]
        budget:
          type: number
          nullable: true
        deadline:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true

    ProjectStats:
      type: object
      properties:
        total:
          type: integer
        pending:
          type: integer
        inProgress:
          type: integer
        review:
          type: integer
        completed:
          type: integer
        totalRevenue:
          type: number
        recentCount:
          type: integer
      required:
        - total
        - pending
        - inProgress
        - review
        - completed
        - totalRevenue
        - recentCount

    ActivityItem:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [project_created, status_changed, file_uploaded, message_posted]
        projectId:
          type: integer
        projectTitle:
          type: string
        description:
          type: string
        createdAt:
          type: string
      required:
        - id
        - type
        - projectId
        - projectTitle
        - description
        - createdAt

    ProjectFile:
      type: object
      properties:
        id:
          type: integer
        projectId:
          type: integer
        filename:
          type: string
        originalName:
          type: string
        mimeType:
          type: string
        size:
          type: integer
        url:
          type: string
        createdAt:
          type: string
      required:
        - id
        - projectId
        - filename
        - originalName
        - mimeType
        - size
        - url
        - createdAt

    Message:
      type: object
      properties:
        id:
          type: integer
        projectId:
          type: integer
        content:
          type: string
        author:
          type: string
        authorType:
          type: string
          enum: [client, designer]
        createdAt:
          type: string
      required:
        - id
        - projectId
        - content
        - author
        - authorType
        - createdAt

    CreateMessageBody:
      type: object
      properties:
        content:
          type: string
        author:
          type: string
        authorType:
          type: string
          enum: [client, designer]
      required:
        - content
        - author
        - authorType
